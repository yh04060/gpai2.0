<!-- ===== Attach menu (내 컴퓨터 / AI 드라이브) ===== -->
<div class="attmenu" id="attMenu">
  <button class="attitem" id="attLocal">
    <span class="aic">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.75" y="3.5" width="14.5" height="10" rx="2"/><path d="M7.5 17h5M10 13.5V17"/><path d="M10 11V6.8M8.2 8.4 10 6.6l1.8 1.8"/></svg>

  <button class="attitem" id="attDrive">

      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.5"/><path d="M2.75 11h3.7l1.3 1.9h4.5l1.3-1.9h3.7"/></svg>

  </button>
</div>
<input type="file" id="attFile" style="display:none" multiple>
