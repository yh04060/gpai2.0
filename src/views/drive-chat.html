  <!-- ===== Chat panel (AI Drive) ===== -->
  <aside class="chat" id="chatPanel">
    <div class="chat-h">
      <button class="chat-title">
        <span>새 대화</span>
        <svg class="chev" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
      </button>
      <button class="icbtn" id="chatClose" title="닫기">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="chat-body">
      <div class="chat-empty">
        <svg viewBox="0 0 52 44" width="46" height="38"><rect x="9" y="6" width="34" height="26" rx="9" fill="#CDCDCB"/><rect x="2" y="14" width="6" height="11" rx="3" fill="#CDCDCB"/><rect x="44" y="14" width="6" height="11" rx="3" fill="#CDCDCB"/><circle cx="19.5" cy="19" r="3.2" fill="#fff"/><circle cx="32.5" cy="19" r="3.2" fill="#fff"/><rect x="16" y="36" width="20" height="5" rx="2.5" fill="#E2E2E0"/></svg>
        <p>바로 여기 있어요.<br>내 자료에 대해 무엇이든 물어보세요.</p>
      </div>
    </div>
    <div class="chat-foot">
      <div class="ccard" data-attach>
        <div class="att-row"></div>
        <textarea data-send placeholder="메시지를 입력하세요..."></textarea>
        <div class="crow">
          <button class="plus" title="첨부">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          </button>
          <button class="msel">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="14" height="14" rx="4"/><text x="10" y="12.8" text-anchor="middle" font-size="6.5" font-weight="700" fill="currentColor" stroke="none" font-family="Arial">AI</text></svg>
            <span>GPAI Pro</span>
            <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
          </button>
          <button class="send" title="보내기">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <button class="fab" id="chatFab" style="display:none" title="채팅 열기">
    <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.75c3.7 0 6.75 2.6 6.75 5.75S13.7 15.25 10 15.25c-.75 0-1.5-.1-2.2-.3L4.25 16l.85-2.5A5.5 5.5 0 0 1 3.25 9.5c0-3.15 3.05-5.75 6.75-5.75Z"/></svg>
  </button>

</div>
