    <section class="view" id="view-canvas">
      <div class="cv">
        <div class="s-brand"><b>gpai</b><i>시각화</i></div>
        <h1 class="s-title">어떤 개념이든 시각화하세요</h1>
        <div class="vis-tabs">
          <button class="vtab" data-nav="figure">도식화</button>
          <button class="vtab on">캔버스</button>
        </div>

        <div class="cv-input" data-attach>
          <div class="att-row"></div>
          <textarea data-send placeholder="캔버스로 만들 내용을 입력하세요 (참고 자료를 추가하면 더 정확합니다)"></textarea>
          <div class="cv-row">
            <button class="plus" title="첨부">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m17 9-7.2 7.2a4.6 4.6 0 0 1-6.5-6.5l6.8-6.7a3.1 3.1 0 0 1 4.4 4.4l-6.8 6.7a1.55 1.55 0 0 1-2.2-2.2L12 5.5"/></svg>
            </button>
            <button class="ghostsel">비율
              <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
            </button>
            <div class="right">
              <button class="ghostsel">이미지 2장
                <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
              </button>
              <button class="chip-brand">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9V4.5a1 1 0 0 1 1-1H9a2 2 0 0 1 1.4.6l6 6a2 2 0 0 1 0 2.8l-3.5 3.5a2 2 0 0 1-2.8 0l-6-6A2 2 0 0 1 3.5 9z"/><circle cx="7" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
                스타일 / AI 모델
                <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
              </button>
              <button class="send" title="보내기">
                <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="cv-sec">내 캔버스</div>
        <div class="cv-grid" id="cvGrid"></div>
      </div>
    </section>
