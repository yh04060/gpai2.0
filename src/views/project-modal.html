<!-- ===== 새 프로젝트 만들기 모달 ===== -->
<div class="modal-dim" id="projDim">
  <div class="pickbox" style="width:560px">
    <div class="pick-h">
      <span class="logo-sq">g(π)</span>새 프로젝트 만들기
      <button class="icbtn" id="projClose" title="닫기">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="proj-desc">AI 드라이브에서 루트 폴더를 지정하면, 그 폴더를 관장하는 <b>프로젝트 AI</b>가 함께 만들어져요. 프로젝트 AI는 지정한 폴더 하위의 모든 파일·폴더에 접근할 수 있어요.</div>
    <div class="proj-list" id="projFolders"></div>
    <div class="proj-name">
      <label>프로젝트 AI 이름</label>
      <input id="projName" placeholder="폴더를 선택하면 자동으로 지어져요">
      <span class="hint2">루트 폴더 이름을 따라 자동으로 지어져요 — 원하면 바꿀 수 있어요</span>
    </div>
    <div class="pick-f">
      <span class="hint">폴더 1개 = 프로젝트 1개 · 프로젝트 AI는 폴더 밖 데이터에 접근할 수 없어요</span>
      <button class="btn-ghost" id="projCancel">취소</button>
      <button class="btn-primary" id="projCreate" disabled>만들기</button>
    </div>
  </div>
</div>
